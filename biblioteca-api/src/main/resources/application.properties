spring.application.name=biblioteca-api
# 8081 porque en este equipo el 8080 lo ocupa otro programa
server.port=8081

# Sesiones: horas que dura un token antes de pedir login otra vez
biblioteca.sesion.horas=8

# Catálogo de ejemplo (15 libros, 30 ejemplares): se carga al arrancar solo si no hay libros
biblioteca.datos-ejemplo=true

# Administrador inicial: se crea al arrancar solo si no existe ningún ADMIN
biblioteca.admin.documento=${ADMIN_DOCUMENTO:admin}
biblioteca.admin.nombre=${ADMIN_NOMBRE:Administrador}
biblioteca.admin.contrasena=${ADMIN_CONTRASENA:Admin123*}

# MySQL: se leen de variables de entorno; el valor tras ':' es el de respaldo para desarrollo local
#  - createDatabaseIfNotExist=true  crea la base biblioteca_db si no existe (no hay que crearla a mano)
#  - useSSL=false + allowPublicKeyRetrieval=true  permiten conectarse a un MySQL 8 local sin certificado
#  - serverTimezone  evita desfases al guardar fechas
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/biblioteca_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Fechas en formato ISO (yyyy-MM-dd) en los JSON
spring.jackson.serialization.write-dates-as-timestamps=false
